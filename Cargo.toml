[package]
name = "whobelooking"
version = "0.2.0"
edition = "2024"
description = "Visitor intelligence platform. Any IP source → rDNS → /24 scan → whois → company ID → enrichment flywheel → intelligence report. One binary. Zero cloud."
license = "LicenseRef-Proprietary"
repository = "https://github.com/cochranblock/whobelooking"
keywords = ["analytics", "reverse-dns", "lead-generation", "visitor-intelligence", "threat-detection"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "whobelooking"
path = "src/lib.rs"

[[bin]]
name = "whobelooking"
path = "src/main.rs"

[[bin]]
name = "whobelooking-test"
path = "src/bin/whobelooking-test.rs"
required-features = ["tests"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hickory-resolver = "0.25"
sled = "0.34"
dirs = "5"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["macros"], optional = true }
tower-http = { version = "0.6", features = ["compression-zstd", "trace", "set-header"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chromiumoxide = { version = "0.9", features = ["fetcher", "rustls", "zip8"], optional = true }
futures = { version = "0.3", optional = true }
exopack = { git = "ssh://git@github.com/cochranblock/exopack", features = ["triple_sims"], optional = true }

[features]
default = []
serve = ["dep:axum", "dep:tower-http"]
browser = ["dep:chromiumoxide", "dep:futures"]
tests = ["dep:exopack"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Speed-Diamond — for servers, request-serving. Runtime wins.
[profile.diamond]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false

# Size-Diamond — for edge, phones, embedded. Bytes win.
[profile.diamond-edge]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
