# cargo-audit config — local ignore list for advisories already vetted in
# `deny.toml`. Kept in sync with `deny.toml`'s `[advisories].ignore` array;
# the two tools have separate ignore mechanisms but the same upstream
# blocker (sled 0.34 hasn't shipped a release that drops parking_lot 0.11,
# and the bincode team ceased development after a doxxing incident).
#
# Revisit when:
#   * sled bumps to >= 1.0 (drops parking_lot 0.11 + fxhash transitive deps), OR
#   * we complete the cross-repo postcard migration (kova / whobelooking /
#     cochranblock all share the bincode dep).

[advisories]
ignore = [
  "RUSTSEC-2024-0384",  # instant — pulled by sled→parking_lot 0.11
  "RUSTSEC-2025-0057",  # fxhash — pulled by sled
  "RUSTSEC-2025-0141",  # bincode — upstream ceased development
]
